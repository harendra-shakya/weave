<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" font-family="Segoe UI, Roboto, Arial, sans-serif">
  <style>
    .title{fill:#e6ebf2;font-weight:700;font-size:20px}
    .h2{fill:#e6ebf2;font-weight:600;font-size:15px}
    .label{fill:#aab4c0;font-size:13px}
    .muted{fill:#6f7d8c;font-size:12px}
    .num{fill:#e6ebf2;font-weight:700;font-size:26px}
    .nav{fill:#aab4c0;font-size:14px}
    .navA{fill:#4f8cff;font-size:14px;font-weight:700}
    .pillT{font-size:11px;font-weight:600}
  </style>
  <rect width="1440" height="900" fill="#0e1116"/>
  <!-- banner -->
  <rect width="1440" height="30" fill="#1a212a"/>
  <text x="16" y="20" class="muted">Local-only cockpit · fixture data · no secrets · external actions simulated</text>
  <!-- nav -->
  <rect y="30" width="220" height="870" fill="#151a21"/>
  <text x="20" y="62" fill="#e6ebf2" font-weight="700" font-size="18">WEAVE</text>
  <text x="20" y="80" class="muted">Owner Cockpit · v0.2 draft</text>
  <rect x="12" y="100" width="196" height="34" rx="6" fill="#1c232c"/>
  <text x="24" y="122" class="navA">Command Center</text>
  <text x="24" y="162" class="nav">Rooms</text><text x="24" y="202" class="nav">Missions</text>
  <text x="24" y="242" class="nav">Proof Ledger</text><text x="24" y="282" class="nav">Gates</text>
  <text x="24" y="322" class="nav">Runtime</text><text x="24" y="362" class="nav">Settings</text>

  <!-- header -->
  <text x="244" y="64" class="title">Command Center</text>
  <text x="244" y="84" class="muted">What needs you right now — across all Rooms</text>
  <!-- legend -->
  <g class="pillT">
    <rect x="244" y="98" width="74" height="20" rx="10" fill="rgba(255,93,93,0.14)"/><text x="252" y="112" fill="#ff5d5d">Blocked</text>
    <rect x="326" y="98" width="118" height="20" rx="10" fill="rgba(255,184,77,0.14)"/><text x="334" y="112" fill="#ffb84d">Approval required</text>
    <rect x="452" y="98" width="92" height="20" rx="10" fill="rgba(255,138,76,0.14)"/><text x="460" y="112" fill="#ff8a4c">Needs owner</text>
    <rect x="552" y="98" width="116" height="20" rx="10" fill="rgba(87,166,255,0.14)"/><text x="560" y="112" fill="#57a6ff">Ready for review</text>
    <rect x="676" y="98" width="104" height="20" rx="10" fill="rgba(139,151,165,0.14)"/><text x="684" y="112" fill="#8b97a5">Stale / no proof</text>
    <rect x="788" y="98" width="52" height="20" rx="10" fill="rgba(70,201,128,0.14)"/><text x="796" y="112" fill="#46c980">None</text>
  </g>

  <!-- KPI strip -->
  <g>
    <rect x="244" y="132" width="222" height="84" rx="8" fill="#151a21" stroke="#2b3543"/><text x="260" y="170" class="num">4</text><text x="260" y="196" class="label">Active Rooms</text>
    <rect x="478" y="132" width="222" height="84" rx="8" fill="#151a21" stroke="#2b3543"/><text x="494" y="170" class="num">7</text><text x="494" y="196" class="label">Open Missions</text>
    <rect x="712" y="132" width="222" height="84" rx="8" fill="#151a21" stroke="#2b3543"/><text x="728" y="170" class="num" fill="#ffb84d">2</text><text x="728" y="196" class="label">Needs-owner approvals</text>
    <rect x="946" y="132" width="222" height="84" rx="8" fill="#151a21" stroke="#2b3543"/><text x="962" y="170" class="num" fill="#ff5d5d">1</text><text x="962" y="196" class="label">Blocked</text>
    <rect x="1180" y="132" width="228" height="84" rx="8" fill="#151a21" stroke="#2b3543"/><text x="1196" y="170" class="num" fill="#57a6ff">3</text><text x="1196" y="196" class="label">Ready for review</text>
  </g>

