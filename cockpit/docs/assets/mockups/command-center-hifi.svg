  <text x="262" y="262" class="h2">Needs your attention</text>
  <text x="926" y="262" class="muted" text-anchor="end">severity-sorted · click to open</text>
  <g class="pillT">
    <rect x="262" y="278" width="664" height="56" rx="6" fill="#1c232c"/><rect x="276" y="296" width="62" height="20" rx="10" fill="rgba(255,93,93,0.14)"/><text x="284" y="310" fill="#ff5d5d">Blocked</text><text x="352" y="302" class="label">Receipts App — deployment blocked until provider access validated</text><text x="352" y="322" class="muted">Gate · deploy-to-production</text>
    <rect x="262" y="342" width="664" height="56" rx="6" fill="#1c232c"/><rect x="276" y="360" width="104" height="20" rx="10" fill="rgba(255,184,77,0.14)"/><text x="284" y="374" fill="#ffb84d">Approval req.</text><text x="394" y="366" class="label">Habit Tracker — connect Linear write access</text><text x="394" y="386" class="muted">Gate · external-mirror-write</text>
    <rect x="262" y="406" width="664" height="56" rx="6" fill="#1c232c"/><rect x="276" y="424" width="86" height="20" rx="10" fill="rgba(255,138,76,0.14)"/><text x="284" y="438" fill="#ff8a4c">Needs owner</text><text x="376" y="430" class="label">Receipts App — intent acceptance checks not recorded</text><text x="376" y="450" class="muted">Blocker · owner-context-needed</text>
    <rect x="262" y="470" width="664" height="56" rx="6" fill="#1c232c"/><rect x="276" y="488" width="92" height="20" rx="10" fill="rgba(87,166,255,0.14)"/><text x="284" y="502" fill="#57a6ff">Ready review</text><text x="382" y="494" class="label">Calculator — engineering proof recorded, awaiting your review</text><text x="382" y="514" class="muted">Proof · TASK-0007</text>
    <rect x="262" y="534" width="664" height="56" rx="6" fill="#1c232c"/><rect x="276" y="552" width="98" height="20" rx="10" fill="rgba(139,151,165,0.14)"/><text x="284" y="566" fill="#8b97a5">Stale / no proof</text><text x="388" y="558" class="label">Notes App — selection stage idle, no proof recorded</text><text x="388" y="578" class="muted">Stage · selection</text>
    <text x="276" y="632" class="muted">+ 2 more …</text>
  </g>

  <!-- Active Rooms -->
  <rect x="958" y="232" width="450" height="220" rx="8" fill="#151a21" stroke="#2b3543"/>
  <text x="976" y="262" class="h2">Active Rooms</text>
  <g class="pillT">
    <rect x="976" y="278" width="200" height="70" rx="6" fill="#1c232c"/><text x="988" y="304" class="label">Receipts App</text><text x="988" y="324" class="muted">stage: deployment</text><rect x="988" y="330" width="52" height="14" rx="7" fill="rgba(255,93,93,0.14)"/>
    <rect x="1190" y="278" width="200" height="70" rx="6" fill="#1c232c"/><text x="1202" y="304" class="label">Habit Tracker</text><text x="1202" y="324" class="muted">stage: engineering</text><rect x="1202" y="330" width="52" height="14" rx="7" fill="rgba(255,184,77,0.14)"/>
    <rect x="976" y="360" width="200" height="70" rx="6" fill="#1c232c"/><text x="988" y="386" class="label">Calculator</text><text x="988" y="406" class="muted">stage: qa</text><rect x="988" y="412" width="52" height="14" rx="7" fill="rgba(87,166,255,0.14)"/>
    <rect x="1190" y="360" width="200" height="70" rx="6" fill="#1c232c"/><text x="1202" y="386" class="label">Notes App</text><text x="1202" y="406" class="muted">stage: selection</text><rect x="1202" y="412" width="52" height="14" rx="7" fill="rgba(139,151,165,0.14)"/>
  </g>

  <!-- Runtime checkpoints -->
  <rect x="958" y="468" width="450" height="194" rx="8" fill="#151a21" stroke="#2b3543"/>
  <text x="976" y="498" class="h2">Latest runtime checkpoints</text>
  <circle cx="982" cy="524" r="4" fill="#46c980"/><text x="996" y="528" class="label">Codex</text><text x="996" y="546" class="muted">healthy · planning Receipts deploy · 4m ago</text>
  <circle cx="982" cy="574" r="4" fill="#46c980"/><text x="996" y="578" class="label">Claude</text><text x="996" y="596" class="muted">healthy · engineering Habit Tracker · 11m ago</text>
  <circle cx="982" cy="624" r="4" fill="#ff8a4c"/><text x="996" y="628" class="label">Local runtime</text><text x="996" y="646" class="muted">idle · awaiting owner input · 22m ago</text>

  <text x="244" y="690" class="muted">Hi-fi mockup · dark mission-control theme · colors = tokens.css (Owner Attention palette)</text>
</svg>
