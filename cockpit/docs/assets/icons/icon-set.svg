<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 230" font-family="Segoe UI, Roboto, Arial, sans-serif">
  <style>
    .lbl{fill:#aab4c0;font-size:12px;font-weight:600}
    .ttl{fill:#e6ebf2;font-size:18px;font-weight:700}
    .sub{fill:#6f7d8c;font-size:12px}
    .tile{fill:#151a21;stroke:#2b3543}
    .g{fill:none;stroke:#aab4c0;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  </style>
  <rect width="920" height="230" fill="#0e1116"/>
  <text x="40" y="34" class="ttl">WEAVE Owner Cockpit — source &amp; Agent icon set</text>
  <text x="40" y="54" class="sub">in-repo inline SVG glyphs · monochrome (single accent for WEAVE) · no remote / network assets</text>

  <!-- WEAVE (accent) -->
  <rect class="tile" x="40" y="70" width="116" height="120" rx="8"/>
  <g transform="translate(98,118)" fill="none" stroke="#4f8cff" stroke-width="2.6" stroke-linecap="round">
    <ellipse cx="0" cy="0" rx="15" ry="7.5" transform="rotate(-40)"/>
    <ellipse cx="0" cy="0" rx="15" ry="7.5" transform="rotate(40)"/>
  </g>
  <text x="98" y="172" class="lbl" text-anchor="middle">WEAVE</text>

  <!-- Linear -->
  <rect class="tile" x="165" y="70" width="116" height="120" rx="8"/>
  <g transform="translate(223,118) rotate(-45)" class="g" stroke-width="3">
    <line x1="-12" y1="-8" x2="12" y2="-8"/>
    <line x1="-14" y1="0" x2="14" y2="0"/>
    <line x1="-12" y1="8" x2="12" y2="8"/>
  </g>
  <text x="223" y="172" class="lbl" text-anchor="middle">Linear · Mirror</text>

  <!-- Slack -->
  <rect class="tile" x="290" y="70" width="116" height="120" rx="8"/>
  <g transform="translate(348,118)" fill="#aab4c0">
    <rect x="-3" y="-16" width="6" height="13" rx="3"/>
    <rect x="3" y="-3" width="13" height="6" rx="3"/>
    <rect x="-3" y="3" width="6" height="13" rx="3"/>
    <rect x="-16" y="-3" width="13" height="6" rx="3"/>
  </g>
  <text x="348" y="172" class="lbl" text-anchor="middle">Slack · Mirror</text>

  <!-- GitHub -->
  <rect class="tile" x="415" y="70" width="116" height="120" rx="8"/>
  <g transform="translate(473,118)" class="g">
    <line x1="-7" y1="-11" x2="-7" y2="11"/>
    <circle cx="-7" cy="-12" r="3.2"/>
    <circle cx="-7" cy="12" r="3.2"/>
    <path d="M-7 -2 L6 -7"/>
    <circle cx="8" cy="-9" r="3.2"/>
  </g>
  <text x="473" y="172" class="lbl" text-anchor="middle">GitHub · Mirror</text>

  <!-- Codex -->
  <rect class="tile" x="540" y="70" width="116" height="120" rx="8"/>
  <g transform="translate(598,118)" class="g" stroke-width="2.4">
    <polyline points="-4,-9 -13,0 -4,9"/>
    <polyline points="4,-9 13,0 4,9"/>
  </g>
  <text x="598" y="172" class="lbl" text-anchor="middle">Codex · Agent</text>

  <!-- Claude -->
  <rect class="tile" x="665" y="70" width="116" height="120" rx="8"/>
  <g transform="translate(723,118)" class="g" stroke-width="2.4">
    <line x1="0" y1="-11" x2="0" y2="11"/>
    <line x1="-9.5" y1="-5.5" x2="9.5" y2="5.5"/>
    <line x1="9.5" y1="-5.5" x2="-9.5" y2="5.5"/>
  </g>
  <text x="723" y="172" class="lbl" text-anchor="middle">Claude · Agent</text>

  <!-- Local runtime -->
  <rect class="tile" x="790" y="70" width="116" height="120" rx="8"/>
  <g transform="translate(848,118)" class="g" stroke-width="1.8">
    <rect x="-15" y="-11" width="30" height="22" rx="3"/>
    <polyline points="-7,-3 -2,2 -7,7"/>
    <line x1="0" y1="7" x2="7" y2="7"/>
  </g>
  <text x="848" y="172" class="lbl" text-anchor="middle">Local runtime</text>

  <text x="40" y="214" class="sub">Mirrors (Linear/Slack/GitHub) always render beside the "Mirror — not source of truth" badge, never as a bare logo. The legacy example runtime name listed in ATM-385 is omitted — the repo scanner blocks it as a legacy surface (see brief §9 / Q-A).</text>
</svg>
