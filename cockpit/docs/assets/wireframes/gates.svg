<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" font-family="Segoe UI, Arial, sans-serif">
  <style>
    .page{fill:#eef0f3}.banner{fill:#dfe3e8}.nav{fill:#f7f8fa}
    .navItem{fill:#5b6573;font-size:14px}.navActive{fill:#dde2e8}
    .brand{fill:#2b313b;font-weight:700;font-size:18px}.sub{fill:#9aa3b0;font-size:12px}
    .panel{fill:#ffffff;stroke:#ccd2da}.title{fill:#2b313b;font-weight:700;font-size:20px}
    .h2{fill:#2b313b;font-weight:600;font-size:15px}.label{fill:#707a88;font-size:13px}
    .muted{fill:#9aa3b0;font-size:12px}.chip{fill:#f0f2f5;stroke:#b6bdc8}.chipT{fill:#5b6573;font-size:11px}
    .row{fill:#fbfcfd;stroke:#e2e6eb}.btn{fill:#e3e7ec;stroke:#aeb6c1}.btnT{fill:#2b313b;font-size:13px;font-weight:600}
    .warn{fill:#f3eee4;stroke:#d8caa6}.done{fill:#e9f0ea;stroke:#bcd0c0}
  </style>
  <rect class="page" width="1440" height="900"/>
  <rect class="banner" width="1440" height="30"/><text x="16" y="20" class="label">Local-only cockpit · fixture data · no secrets · external actions simulated</text>
  <rect class="nav" y="30" width="220" height="870"/>
  <text x="20" y="62" class="brand">WEAVE</text><text x="20" y="80" class="sub">Owner Cockpit · v0.2 draft</text>
  <text x="24" y="122" class="navItem">Command Center</text><text x="24" y="162" class="navItem">Rooms</text><text x="24" y="202" class="navItem">Missions</text><text x="24" y="242" class="navItem">Proof Ledger</text>
  <rect class="navActive" x="12" y="260" width="196" height="34" rx="6"/><text x="24" y="282" class="navItem" font-weight="700" fill="#2b313b">Gates</text>
  <text x="24" y="322" class="navItem">Runtime</text><text x="24" y="362" class="navItem">Settings</text>

  <text x="244" y="64" class="title">Gate / Approval Queue</text><text x="244" y="84" class="muted">Risky transitions blocked until you approve — external effects are simulated only</text>

  <!-- GATE 1 expanded -->
  <rect class="panel" x="244" y="100" width="1164" height="320" rx="8"/>
  <text x="262" y="130" class="h2">Deploy Receipts App to production</text>
  <rect class="chip" x="640" y="114" width="104" height="20" rx="10"/><text x="648" y="128" class="chipT">Approval required</text>
  <rect class="warn" x="756" y="114" width="150" height="20" rx="10"/><text x="764" y="128" class="chipT">blast radius: HIGH</text>

  <text x="262" y="164" class="label">Required approval / proof</text>
  <rect class="row" x="262" y="176" width="540" height="120" rx="6"/>
  <text x="276" y="200" class="muted">Provider access must be validated before deploy:</text>
  <rect class="chip" x="276" y="212" width="220" height="20" rx="10"/><text x="284" y="226" class="chipT">cloudflare · not_validated</text>
  <rect class="chip" x="276" y="240" width="220" height="20" rx="10"/><text x="284" y="254" class="chipT">vercel · not_validated</text>
  <text x="276" y="284" class="muted">caps: domain_authority, dns_*, hosting_project_access …</text>

  <text x="828" y="164" class="label">Decision</text>
  <rect class="row" x="828" y="176" width="560" height="120" rx="6"/>
  <text x="844" y="200" class="muted">current: blocked_until_validated · launch_allowed = false</text>
  <rect class="btn" x="844" y="216" width="220" height="44" rx="6"/><text x="864" y="243" class="btnT">Approve (local-only)</text>
  <rect class="row" x="1080" y="216" width="120" height="44" rx="6"/><text x="1104" y="243" class="btnT">Hold</text>
  <text x="844" y="284" class="muted" font-weight="700" fill="#9a7b3a">External effect is SIMULATED — no real deploy / DNS / credential action is performed.</text>

  <!-- non-claims -->
  <rect x="262" y="320" width="1126" height="80" rx="6" fill="#f5f6f8" stroke="#e2e6eb"/>
  <text x="276" y="346" class="muted" font-weight="700">Not proven by approving here</text>
  <text x="276" y="368" class="muted">does not prove provider account access · does not perform DNS mutation · does not store raw secrets</text>
  <text x="276" y="388" class="muted">records a local owner decision + a SIMULATED event only</text>

  <!-- GATE 2 confirmed example -->
  <rect class="panel" x="244" y="440" width="1164" height="180" rx="8"/>
  <text x="262" y="470" class="h2">Connect Linear write access (mirror)</text>
  <rect class="done" x="560" y="454" width="210" height="20" rx="10"/><text x="568" y="468" class="chipT">Approved (local-only · simulated)</text>
  <text x="262" y="500" class="muted">blast radius: MEDIUM · Linear is a Mirror/Courier — never the source of truth</text>
  <rect class="done" x="262" y="516" width="700" height="80" rx="6"/>
  <text x="276" y="542" class="muted" font-weight="700">Confirmation</text>
  <text x="276" y="564" class="muted">Decision recorded to overlay · event appended: gate.approved (SIMULATED)</text>
  <text x="276" y="584" class="muted">No real Linear write performed. Reversible locally.</text>

  <!-- empty/other -->
  <rect class="panel" x="244" y="640" width="1164" height="100" rx="8"/>
  <text x="262" y="670" class="h2">Eval hard gates (read-only)</text>
  <text x="262" y="696" class="muted">engineering: unit_tests_pass ✓ · diff_check_clean ✓ · no_secret_leakage ✓  —  shown from packages/weave-tool/evals/lifecycle/*.yaml</text>
  <text x="262" y="720" class="muted">these advance/block stage transitions automatically; not owner-approvable</text>

  <text x="244" y="780" class="muted">Wireframe · low-fidelity — this is the screen carrying the MVP's required owner action (Approve / Hold), with the SIMULATED boundary explicit.</text>
</svg>
