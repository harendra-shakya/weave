<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" font-family="Segoe UI, Arial, sans-serif">
  <style>
    .page{fill:#eef0f3}
    .banner{fill:#dfe3e8}
    .nav{fill:#f7f8fa}
    .navItem{fill:#5b6573;font-size:14px}
    .navActive{fill:#dde2e8}
    .brand{fill:#2b313b;font-weight:700;font-size:18px}
    .sub{fill:#9aa3b0;font-size:12px}
    .panel{fill:#ffffff;stroke:#ccd2da}
    .title{fill:#2b313b;font-weight:700;font-size:20px}
    .h2{fill:#2b313b;font-weight:600;font-size:15px}
    .label{fill:#707a88;font-size:13px}
    .muted{fill:#9aa3b0;font-size:12px}
    .num{fill:#2b313b;font-weight:700;font-size:26px}
    .chip{fill:#f0f2f5;stroke:#b6bdc8}
    .chipT{fill:#5b6573;font-size:11px}
    .row{fill:#fbfcfd;stroke:#e2e6eb}
  </style>
  <rect class="page" width="1440" height="900"/>
  <!-- banner -->
  <rect class="banner" width="1440" height="30"/>
  <text x="16" y="20" class="label">Local-only cockpit · fixture data · no secrets · external actions simulated</text>
  <!-- nav -->
  <rect class="nav" y="30" width="220" height="870"/>
  <text x="20" y="62" class="brand">WEAVE</text>
  <text x="20" y="80" class="sub">Owner Cockpit · v0.2 draft</text>
  <rect class="navActive" x="12" y="100" width="196" height="34" rx="6"/>
  <text x="24" y="122" class="navItem" font-weight="700" fill="#2b313b">Command Center</text>
  <text x="24" y="162" class="navItem">Workspaces</text>
  <text x="24" y="202" class="navItem">Tasks</text>
  <text x="24" y="242" class="navItem">Proof Ledger</text>
  <text x="24" y="282" class="navItem">Gates</text>
  <text x="24" y="322" class="navItem">Agents</text>
  <text x="24" y="362" class="navItem">Settings</text>

  <!-- header -->
  <text x="244" y="64" class="title">Command Center</text>
  <text x="244" y="84" class="muted">What needs you right now — across all Workspaces</text>
  <!-- attention legend -->
  <g>
    <rect class="chip" x="244" y="98" width="80" height="20" rx="10"/><text x="252" y="112" class="chipT">Blocked</text>
    <rect class="chip" x="330" y="98" width="118" height="20" rx="10"/><text x="338" y="112" class="chipT">Approval required</text>
    <rect class="chip" x="454" y="98" width="92" height="20" rx="10"/><text x="462" y="112" class="chipT">Needs owner</text>
    <rect class="chip" x="552" y="98" width="116" height="20" rx="10"/><text x="560" y="112" class="chipT">Ready for review</text>
    <rect class="chip" x="674" y="98" width="104" height="20" rx="10"/><text x="682" y="112" class="chipT">Stale / no proof</text>
    <rect class="chip" x="784" y="98" width="56" height="20" rx="10"/><text x="792" y="112" class="chipT">None</text>
  </g>

  <!-- KPI strip -->
  <g>
    <rect class="panel" x="244" y="132" width="222" height="84" rx="8"/><text x="260" y="170" class="num">4</text><text x="260" y="196" class="label">Active Workspaces</text>
    <rect class="panel" x="478" y="132" width="222" height="84" rx="8"/><text x="494" y="170" class="num">7</text><text x="494" y="196" class="label">Open Tasks</text>
    <rect class="panel" x="712" y="132" width="222" height="84" rx="8"/><text x="728" y="170" class="num">2</text><text x="728" y="196" class="label">Needs-owner approvals</text>
    <rect class="panel" x="946" y="132" width="222" height="84" rx="8"/><text x="962" y="170" class="num">1</text><text x="962" y="196" class="label">Blocked</text>
    <rect class="panel" x="1180" y="132" width="228" height="84" rx="8"/><text x="1196" y="170" class="num">3</text><text x="1196" y="196" class="label">Ready for review</text>
  </g>

  <!-- Needs your attention -->
  <rect class="panel" x="244" y="232" width="700" height="430" rx="8"/>
  <text x="262" y="262" class="h2">Needs your attention</text>
  <text x="900" y="262" class="muted" text-anchor="end">severity-sorted · click to open</text>
  <g>
    <rect class="row" x="262" y="278" width="664" height="56" rx="6"/><rect class="chip" x="276" y="296" width="62" height="20" rx="10"/><text x="284" y="310" class="chipT">Blocked</text><text x="352" y="302" class="label">Receipts App — deployment blocked until provider access validated</text><text x="352" y="322" class="muted">Gate · deploy-to-production</text>
    <rect class="row" x="262" y="342" width="664" height="56" rx="6"/><rect class="chip" x="276" y="360" width="104" height="20" rx="10"/><text x="284" y="374" class="chipT">Approval req.</text><text x="394" y="366" class="label">Habit Tracker — connect Linear write access</text><text x="394" y="386" class="muted">Gate · external-mirror-write</text>
    <rect class="row" x="262" y="406" width="664" height="56" rx="6"/><rect class="chip" x="276" y="424" width="86" height="20" rx="10"/><text x="284" y="438" class="chipT">Needs owner</text><text x="376" y="430" class="label">Receipts App — intent acceptance checks not recorded</text><text x="376" y="450" class="muted">Blocker · owner-context-needed</text>
    <rect class="row" x="262" y="470" width="664" height="56" rx="6"/><rect class="chip" x="276" y="488" width="110" height="20" rx="10"/><text x="284" y="502" class="chipT">Ready review</text><text x="400" y="494" class="label">Calculator — engineering proof recorded, awaiting your review</text><text x="400" y="514" class="muted">Proof · TASK-0007</text>
    <rect class="row" x="262" y="534" width="664" height="56" rx="6"/><rect class="chip" x="276" y="552" width="98" height="20" rx="10"/><text x="284" y="566" class="chipT">Stale / no proof</text><text x="388" y="558" class="label">Notes App — selection stage idle, no proof recorded</text><text x="388" y="578" class="muted">Stage · selection</text>
    <rect class="row" x="262" y="598" width="664" height="46" rx="6"/><text x="276" y="626" class="muted">+ 2 more …</text>
  </g>

  <!-- Active Workspaces -->
  <rect class="panel" x="958" y="232" width="450" height="220" rx="8"/>
  <text x="976" y="262" class="h2">Active Workspaces</text>
  <rect class="row" x="976" y="278" width="200" height="70" rx="6"/><text x="988" y="304" class="label">Receipts App</text><text x="988" y="324" class="muted">stage: deployment</text><rect class="chip" x="988" y="330" width="52" height="16" rx="8"/>
  <rect class="row" x="1190" y="278" width="200" height="70" rx="6"/><text x="1202" y="304" class="label">Habit Tracker</text><text x="1202" y="324" class="muted">stage: engineering</text><rect class="chip" x="1202" y="330" width="52" height="16" rx="8"/>
  <rect class="row" x="976" y="360" width="200" height="70" rx="6"/><text x="988" y="386" class="label">Calculator</text><text x="988" y="406" class="muted">stage: qa</text><rect class="chip" x="988" y="412" width="52" height="16" rx="8"/>
  <rect class="row" x="1190" y="360" width="200" height="70" rx="6"/><text x="1202" y="386" class="label">Notes App</text><text x="1202" y="406" class="muted">stage: selection</text><rect class="chip" x="1202" y="412" width="52" height="16" rx="8"/>

  <!-- Runtime checkpoints -->
  <rect class="panel" x="958" y="468" width="450" height="194" rx="8"/>
  <text x="976" y="498" class="h2">Latest Agent checkpoints</text>
  <text x="976" y="528" class="label">Codex</text><text x="976" y="546" class="muted">healthy · planning Receipts deploy · 4m ago</text>
  <text x="976" y="578" class="label">Claude</text><text x="976" y="596" class="muted">healthy · engineering Habit Tracker · 11m ago</text>
  <text x="976" y="628" class="label">Local runtime</text><text x="976" y="646" class="muted">idle · awaiting owner input · 22m ago</text>

  <text x="244" y="690" class="muted">Wireframe · low-fidelity · greyscale structure only — color &amp; type treatment in DESIGN_SYSTEM.md</text>
</svg>
