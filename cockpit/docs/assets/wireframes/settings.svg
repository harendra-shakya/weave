<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" font-family="Segoe UI, Arial, sans-serif">
  <style>
    .page{fill:#eef0f3}.banner{fill:#dfe3e8}.nav{fill:#f7f8fa}
    .navItem{fill:#5b6573;font-size:14px}.navActive{fill:#dde2e8}
    .brand{fill:#2b313b;font-weight:700;font-size:18px}.sub{fill:#9aa3b0;font-size:12px}
    .panel{fill:#ffffff;stroke:#ccd2da}.title{fill:#2b313b;font-weight:700;font-size:20px}
    .h2{fill:#2b313b;font-weight:600;font-size:15px}.label{fill:#707a88;font-size:13px}
    .muted{fill:#9aa3b0;font-size:12px}.chip{fill:#f0f2f5;stroke:#b6bdc8}.chipT{fill:#5b6573;font-size:11px}
    .row{fill:#fbfcfd;stroke:#e2e6eb}.sel{fill:#dde6dd;stroke:#bcd0c0}.mono{font-family:Consolas,monospace;fill:#707a88;font-size:12px}
  </style>
  <rect class="page" width="1440" height="900"/>
  <rect class="banner" width="1440" height="30"/><text x="16" y="20" class="label">Local-only cockpit · fixture data · no secrets · external actions simulated</text>
  <rect class="nav" y="30" width="220" height="870"/>
  <text x="20" y="62" class="brand">WEAVE</text><text x="20" y="80" class="sub">Owner Cockpit · v0.2 draft</text>
  <text x="24" y="122" class="navItem">Command Center</text><text x="24" y="162" class="navItem">Rooms</text><text x="24" y="202" class="navItem">Missions</text><text x="24" y="242" class="navItem">Proof Ledger</text><text x="24" y="282" class="navItem">Gates</text><text x="24" y="322" class="navItem">Runtime</text>
  <rect class="navActive" x="12" y="340" width="196" height="34" rx="6"/><text x="24" y="362" class="navItem" font-weight="700" fill="#2b313b">Settings</text>

  <text x="244" y="64" class="title">Settings / Data Source</text><text x="244" y="84" class="muted">Make the proof boundary explicit and honest</text>

  <!-- data source -->
  <rect class="panel" x="244" y="100" width="700" height="190" rx="8"/>
  <text x="262" y="130" class="h2">Data source</text>
  <rect class="sel" x="262" y="146" width="320" height="64" rx="6"/><text x="278" y="172" class="label" font-weight="700">Fixture data</text><text x="278" y="194" class="muted">selected · bundled demo home</text>
  <rect class="row" x="600" y="146" width="320" height="64" rx="6"/><text x="616" y="172" class="label">Live local WEAVE home</text><text x="616" y="194" class="muted">point at a real runs/ home</text>
  <text x="262" y="240" class="label">Resolved path</text>
  <text x="262" y="262" class="mono">&lt;cockpit&gt;/fixtures/weave-home/   (placeholder — no real user path shown)</text>

  <!-- proof boundary -->
  <rect class="panel" x="244" y="306" width="700" height="280" rx="8"/>
  <text x="262" y="336" class="h2">Proof boundary</text>
  <text x="262" y="366" class="muted">· Local-only cockpit — reads/writes files on this machine only</text>
  <text x="262" y="392" class="muted">· No secrets are read, requested, or shown</text>
  <text x="262" y="418" class="muted">· External actions (deploy, Slack/Linear/GitHub writes) are SIMULATED only</text>
  <text x="262" y="444" class="muted">· Owner actions persist to a local overlay file (survives refresh / restart)</text>
  <text x="262" y="470" class="muted">· Not production · not externally verified</text>
  <rect class="row" x="262" y="494" width="660" height="70" rx="6"/>
  <text x="276" y="520" class="muted" font-weight="700">What this proves vs. doesn't</text>
  <text x="276" y="542" class="muted">proves: the cockpit renders WEAVE state &amp; records local decisions — nothing external.</text>

  <!-- mirrors -->
  <rect class="panel" x="960" y="100" width="448" height="486" rx="8"/>
  <text x="978" y="130" class="h2">Mirrors / Couriers</text>
  <text x="978" y="150" class="muted">reflect or carry state — never the source of truth</text>
  <rect class="row" x="978" y="166" width="412" height="80" rx="6"/><text x="992" y="192" class="label" font-weight="700">Linear</text><rect class="chip" x="1280" y="178" width="100" height="18" rx="9"/><text x="1288" y="191" class="chipT">disconnected</text><text x="992" y="216" class="muted">Mirror · simulated · linear_required = false</text>
  <rect class="row" x="978" y="254" width="412" height="80" rx="6"/><text x="992" y="280" class="label" font-weight="700">Slack</text><rect class="chip" x="1280" y="266" width="100" height="18" rx="9"/><text x="1288" y="279" class="chipT">disconnected</text><text x="992" y="304" class="muted">Courier · simulated</text>
  <rect class="row" x="978" y="342" width="412" height="80" rx="6"/><text x="992" y="368" class="label" font-weight="700">GitHub</text><rect class="chip" x="1280" y="354" width="100" height="18" rx="9"/><text x="1288" y="367" class="chipT">disconnected</text><text x="992" y="392" class="muted">Mirror · simulated</text>
  <rect class="row" x="978" y="442" width="412" height="120" rx="6"/><text x="992" y="468" class="label" font-weight="700">About</text><text x="992" y="492" class="muted">WEAVE 0.2 — draft, not final.</text><text x="992" y="514" class="muted">Owner cockpit MVP · local sprint deliverable.</text>

  <text x="244" y="640" class="muted">Wireframe · low-fidelity — the trust screen: data-source toggle, proof boundary, and Mirror/Courier honesty.</text>
</svg>
