<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" font-family="Segoe UI, Arial, sans-serif">
  <style>
    .page{fill:#eef0f3}.banner{fill:#dfe3e8}.nav{fill:#f7f8fa}
    .navItem{fill:#5b6573;font-size:14px}.navActive{fill:#dde2e8}
    .brand{fill:#2b313b;font-weight:700;font-size:18px}.sub{fill:#9aa3b0;font-size:12px}
    .panel{fill:#ffffff;stroke:#ccd2da}.title{fill:#2b313b;font-weight:700;font-size:20px}
    .h2{fill:#2b313b;font-weight:600;font-size:15px}.label{fill:#707a88;font-size:13px}
    .muted{fill:#9aa3b0;font-size:12px}.chip{fill:#f0f2f5;stroke:#b6bdc8}.chipT{fill:#5b6573;font-size:11px}
    .row{fill:#fbfcfd;stroke:#e2e6eb}.mono{font-family:Consolas,monospace;fill:#707a88;font-size:12px}
    .sim{fill:#f3eee4;stroke:#d8caa6}.real{fill:#e9f0ea;stroke:#bcd0c0}
  </style>
  <rect class="page" width="1440" height="900"/>
  <rect class="banner" width="1440" height="30"/><text x="16" y="20" class="label">Local-only cockpit · fixture data · no secrets · external actions simulated</text>
  <rect class="nav" y="30" width="220" height="870"/>
  <text x="20" y="62" class="brand">WEAVE</text><text x="20" y="80" class="sub">Owner Cockpit · v0.2 draft</text>
  <text x="24" y="122" class="navItem">Command Center</text><text x="24" y="162" class="navItem">Rooms</text><text x="24" y="202" class="navItem">Missions</text>
  <rect class="navActive" x="12" y="220" width="196" height="34" rx="6"/><text x="24" y="242" class="navItem" font-weight="700" fill="#2b313b">Proof Ledger</text>
  <text x="24" y="282" class="navItem">Gates</text><text x="24" y="322" class="navItem">Runtime</text><text x="24" y="362" class="navItem">Settings</text>

  <text x="244" y="64" class="title">Proof / Evidence Ledger</text><text x="244" y="84" class="muted">Every claim, its evidence, and what it does NOT prove</text>

  <!-- envelope list + expanded -->
  <rect class="panel" x="244" y="100" width="760" height="766" rx="8"/>
  <text x="262" y="128" class="h2">Proof envelopes</text>

  <!-- collapsed rows -->
  <rect class="row" x="262" y="144" width="724" height="48" rx="6"/><text x="276" y="166" class="label">"Skeleton home and app state created locally"</text><text x="276" y="184" class="muted">Calculator · recorded</text><rect class="real" x="864" y="158" width="110" height="20" rx="10"/><text x="874" y="172" class="chipT">local proof</text>
  <rect class="row" x="262" y="200" width="724" height="48" rx="6"/><text x="276" y="222" class="label">"Receipt export wired locally"</text><text x="276" y="240" class="muted">Receipts · recorded</text><rect class="real" x="864" y="214" width="110" height="20" rx="10"/><text x="874" y="228" class="chipT">local proof</text>

  <!-- expanded envelope -->
  <rect x="262" y="256" width="724" height="430" rx="6" fill="#ffffff" stroke="#c4cbd4"/>
  <text x="276" y="282" class="h2">"Calculator engineering proof recorded"</text>
  <rect class="chip" x="846" y="266" width="128" height="20" rx="10"/><text x="854" y="280" class="chipT">state: recorded ▾</text>
  <text x="276" y="308" class="label">Claim</text><text x="276" y="326" class="muted">Calculator core arithmetic implemented and unit-tested locally.</text>
  <text x="276" y="354" class="label">Proof surface</text><rect class="chip" x="276" y="362" width="170" height="20" rx="10"/><text x="284" y="376" class="chipT">TOOL_VERIFIED_LOCAL</text>
  <text x="276" y="406" class="label">Evidence refs</text>
  <text x="276" y="426" class="mono">apps/tiny-local-calculator/app.json</text>
  <text x="276" y="444" class="mono">apps/tiny-local-calculator/lifecycle/lifecycle-state.json</text>
  <text x="276" y="462" class="mono">apps/tiny-local-calculator/tasks/worker-packets/WP-0007.md</text>
  <text x="276" y="496" class="label">Commands / actions</text><text x="276" y="514" class="mono">python -m unittest · git diff --check</text>
  <!-- review loop -->
  <text x="276" y="548" class="label">Review loop</text>
  <rect class="row" x="276" y="558" width="130" height="28" rx="6"/><text x="290" y="576" class="chipT">Observe recorded</text>
  <rect class="row" x="414" y="558" width="130" height="28" rx="6"/><text x="428" y="576" class="chipT">Validate pending</text>
  <rect class="row" x="552" y="558" width="130" height="28" rx="6"/><text x="566" y="576" class="chipT">Govern gates rec.</text>
  <rect class="row" x="690" y="558" width="120" height="28" rx="6"/><text x="704" y="576" class="chipT">Review pending</text>
  <rect class="row" x="818" y="558" width="120" height="28" rx="6"/><text x="832" y="576" class="chipT">Sync written</text>
  <!-- non-claims -->
  <rect x="276" y="602" width="698" height="70" rx="6" fill="#f5f6f8" stroke="#e2e6eb"/>
  <text x="290" y="624" class="muted" font-weight="700">Not proven (non-claims)</text>
  <text x="290" y="644" class="muted">does not prove deployment · live tracker/Linear mutation · billing/public send · full lifecycle</text>
  <text x="290" y="662" class="muted">does not access credentials or secret values</text>

  <!-- Event log -->
  <rect class="panel" x="1020" y="100" width="388" height="766" rx="8"/>
  <text x="1038" y="128" class="h2">Event log</text><text x="1038" y="148" class="muted">append-only · newest first</text>
  <rect class="sim" x="1038" y="162" width="352" height="56" rx="6"/><text x="1050" y="184" class="chipT" font-weight="700">SIMULATED external effect</text><text x="1050" y="202" class="muted">gate.approved · deploy (no real action) · now</text>
  <rect class="real" x="1038" y="226" width="352" height="48" rx="6"/><text x="1050" y="248" class="muted" font-weight="700">proof.recorded · Calculator · 3m</text><text x="1050" y="266" class="muted">TASK-0007 engineering proof</text>
  <rect class="row" x="1038" y="282" width="352" height="44" rx="6"/><text x="1050" y="308" class="muted">blocker.opened · Receipts · 18m</text>
  <rect class="row" x="1038" y="334" width="352" height="44" rx="6"/><text x="1050" y="360" class="muted">app.recorded · Notes App · 1h</text>
  <text x="1038" y="408" class="muted">Legend:</text>
  <rect class="real" x="1090" y="396" width="120" height="18" rx="9"/><text x="1098" y="409" class="chipT">real local proof</text>
  <rect class="sim" x="1220" y="396" width="150" height="18" rx="9"/><text x="1228" y="409" class="chipT">simulated external</text>

  <text x="244" y="888" class="muted">Wireframe · low-fidelity — envelope list with one expanded; right rail = event log. SIMULATED vs real are visually separated.</text>
</svg>
